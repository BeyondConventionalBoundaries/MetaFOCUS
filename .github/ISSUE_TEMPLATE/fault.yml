name: Fault in a tool
description: Report a fault in the code of a tool of MetaFOCUS.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Issues are for faults in the tools of MetaFOCUS and for suggestions to improve their code. They are not for help with Metashape itself or with individual projects. Please check first that the fault also occurs with the latest release of MetaFOCUS."
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      description: The tool or the part of MetaFOCUS with the fault.
      options:
        - SfM Log Parser
        - Interior Orientation Viewer
        - Tie Point Covariance Exporter
        - Image Parameter Exporter
        - Marker Residual Inspector
        - Unpinned Marker Projection Remover
        - Scale Bar A Priori Uncertainty
        - Gradual Selection Filter
        - Image Subset Selector
        - Image Filter
        - Region Tools
        - Image Footprint Generator
        - GSD Value Exporter
        - GSD Visualiser
        - Depth & Render Export
        - Manual and Terminology
        - Changelog and About MetaFOCUS
        - Check for Updates
        - Installation and menu
    validations:
      required: true
  - type: input
    id: metafocusVersion
    attributes:
      label: MetaFOCUS version
      description: The version that About MetaFOCUS gives, for example 1.0.0.
    validations:
      required: true
  - type: input
    id: metashapeVersion
    attributes:
      label: Metashape version
      description: The version and the build of Metashape, for example 2.3.2 build 22956.
    validations:
      required: true
  - type: input
    id: operatingSystem
    attributes:
      label: Operating system
      description: For example Windows 11.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: The steps that lead to the fault, with the settings of the tool.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened
      description: What the tool did, and what it should have done.
    validations:
      required: true
  - type: textarea
    id: consoleText
    attributes:
      label: Console text
      description: The lines that the tool wrote in the Console pane of Metashape, from the start of the run.
      render: text
    validations:
      required: true
